# Documentation Lint
#
# Doctrine's own CI. Every check here is blocking except the snippet syntax
# check, which is advisory until the guides' fenced examples are corrected.
#
# Runtimes: Node.js 24 (Active LTS until 2026-10-20, EOL 2028-04-30) and
# Python 3.14 (the baseline the guides document).
#
# Every action is pinned to a full commit SHA, per GitHub's secure-use
# guidance: https://docs.github.com/en/actions/reference/security/secure-use-reference

name: Documentation Lint

on:
  pull_request:
    paths:
      - '**.md'
      - '.github/**'
      - 'scripts/**'
      - 'configs/**'
      - '.markdownlint.json'
      - '.markdownlintignore'
      - '.markdown-link-check.json'
      - '.markdown-link-check-internal.json'
      - '.markdownlint-cli2.jsonc'
      - '.gitleaks.toml'
      - 'package.json'
      - 'package-lock.json'
      - 'Makefile'
  push:
    branches: [main]
    paths:
      - '**.md'
      - '.github/**'
      - 'scripts/**'
      - 'configs/**'
      - '.markdownlint.json'
      - '.markdownlintignore'
      - '.markdown-link-check.json'
      - '.markdown-link-check-internal.json'
      - '.markdownlint-cli2.jsonc'
      - '.gitleaks.toml'
      - 'package.json'
      - 'package-lock.json'
      - 'Makefile'
  workflow_dispatch:

# Least privilege: nothing here writes to the repository.
permissions:
  contents: read

concurrency:
  group: doc-lint-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: '24'
  PYTHON_VERSION: '3.14'
  GITLEAKS_VERSION: '8.30.1'
  # sha256 of gitleaks_8.30.1_linux_x64.tar.gz, taken from the release's
  # gitleaks_8.30.1_checksums.txt.
  GITLEAKS_SHA256: '551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb'

jobs:
  markdown:
    name: Markdown, links and structure
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install documentation tools
        run: npm ci

      - name: Lint Markdown
        run: npx --no-install markdownlint-cli2 "**/*.md"

      - name: Check internal links in all first-party Markdown
        run: |
          # Relative targets and heading anchors across every tracked Markdown
          # file except the vendored reference/ tree. No network is involved,
          # so this is deterministic and safe to gate on.
          git ls-files -z '*.md' ':!:reference/**' \
            | xargs -0 npx --no-install markdown-link-check \
                --config .markdown-link-check-internal.json --quiet

      - name: Validate AGENTS.md structure
        run: |
          set -euo pipefail

          # AGENTS.md is the canonical instruction file; CLAUDE.md and
          # GEMINI.md are symlinks to it. These are the sections the file
          # actually declares, and the ones an agent relies on finding.
          required=("Overview" "Repository Structure" "Writing Style")
          missing=0

          for section in "${required[@]}"; do
            if grep -qE "^##[[:space:]]+${section}[[:space:]]*$" AGENTS.md; then
              echo "found: ## ${section}"
            else
              echo "::error file=AGENTS.md::missing required section '## ${section}'"
              missing=1
            fi
          done

          exit "${missing}"

      - name: Verify agent instruction symlinks
        run: |
          set -euo pipefail
          status=0

          for name in CLAUDE.md GEMINI.md; do
            if [ ! -L "${name}" ]; then
              echo "::error file=${name}::expected a symlink to AGENTS.md (ln -sf AGENTS.md ${name})"
              status=1
              continue
            fi
            target="$(readlink "${name}")"
            if [ "${target}" != "AGENTS.md" ]; then
              echo "::error file=${name}::symlink points at '${target}', expected 'AGENTS.md'"
              status=1
            else
              echo "ok: ${name} -> ${target}"
            fi
          done

          exit "${status}"

  secrets:
    name: Secret scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Install Gitleaks
        run: |
          set -euo pipefail
          archive="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          url="https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/${archive}"

          curl --fail-with-body --location --silent --show-error \
            --retry 3 --retry-delay 5 --output "${archive}" "${url}"
          echo "${GITLEAKS_SHA256}  ${archive}" | sha256sum --check --strict

          mkdir -p "${RUNNER_TEMP}/gitleaks"
          tar -xzf "${archive}" -C "${RUNNER_TEMP}/gitleaks" gitleaks
          rm -f "${archive}"
          echo "${RUNNER_TEMP}/gitleaks" >> "${GITHUB_PATH}"

      - name: Confirm the allowlist still rejects a real token
        run: |
          set -euo pipefail

          # The previous grep-based check failed on Doctrine's own "never do
          # this" examples. The allowlist in .gitleaks.toml exempts those, so
          # prove here that it has not been widened into uselessness. The
          # fixture is generated outside the working tree and never committed.
          fixture="${RUNNER_TEMP}/gitleaks-fixture"
          rm -rf "${fixture}"
          mkdir -p "${fixture}"

          python3 - "${fixture}/leak.js" <<'PY'
          import secrets
          import string
          import sys

          ALNUM = string.ascii_letters + string.digits


          def token(length: int) -> str:
              return "".join(secrets.choice(ALNUM) for _ in range(length))


          with open(sys.argv[1], "w", encoding="utf-8") as handle:
              handle.write(f'const githubToken = "ghp_{token(36)}";\n')
              handle.write(f'const stripeKey = "sk_live_{token(24)}";\n')
          PY

          if gitleaks dir "${fixture}" --config .gitleaks.toml --no-banner --redact; then
            echo "::error::.gitleaks.toml no longer detects a realistic token — the allowlist is too broad"
            exit 1
          fi
          echo "self-test passed: realistic tokens are still detected"

      - name: Scan working tree
        run: gitleaks dir . --config .gitleaks.toml --no-banner --redact --verbose

      - name: Scan history
        run: gitleaks git . --config .gitleaks.toml --no-banner --redact

  versions:
    name: Tool version drift
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Unit tests
        run: python3 -m unittest discover scripts

      - name: Validate versions against the canonical pre-commit config
        run: python3 scripts/validate_versions.py

  external-links:
    name: External URLs (advisory)
    runs-on: ubuntu-latest
    # Advisory by design. Reproduced on 2026-09-08: docs.ansible.com and
    # molecule.readthedocs.io answer this checker with 429 and then drop the
    # connection under retry, and openai.com, hhs.gov, stackoverflow.com,
    # dev.mysql.com and lib.rs return 403 to CI user agents. Gating merges on
    # third-party availability would produce a workflow that fails for reasons
    # unrelated to the change — the exact defect this repair is undoing.
    # Genuine 404s are reported to the job summary for follow-up.
    continue-on-error: true
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1


      - name: Verify vendored files match recorded checksums

        run: python3 scripts/check_vendored.py

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install documentation tools
        run: npm ci

      - name: Check external URLs
        run: |
          set -uo pipefail

          # One file at a time: batching raises request concurrency enough that
          # healthy hosts start refusing connections.
          report="$(mktemp)"
          failed=0
          while IFS= read -r -d '' file; do
            if ! npx --no-install markdown-link-check \
                  --config .markdown-link-check.json --quiet --retry "${file}" \
                  >> "${report}" 2>&1; then
              failed=$((failed + 1))
            fi
          done < <(git ls-files -z '*.md' ':!:reference/**')

          {
            echo '## External link check'
            echo
            if [ "${failed}" -eq 0 ]; then
              echo 'Every external URL resolved.'
            else
              echo "${failed} file(s) contain unreachable external URLs."
              echo
              echo '```'
              grep -E '^(ERROR:|\s+\[)' "${report}" || true
              echo '```'
            fi
          } >> "${GITHUB_STEP_SUMMARY}"

          exit "${failed}"

  snippets:
    name: Snippet syntax (advisory)
    runs-on: ubuntu-latest
    # Advisory only: the guides carry mistagged and incomplete fenced blocks
    # that are being corrected separately. Drop continue-on-error, and the
    # --warn flag, once the reported failures reach zero.
    continue-on-error: true
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.27'
          cache: false

      - name: Install checkers
        run: |
          npm ci
          python3 -m pip install --disable-pip-version-check --quiet 'PyYAML==6.0.3'

      - name: Syntax-check fenced code blocks
        run: python3 scripts/check_snippets.py --warn --summary "${GITHUB_STEP_SUMMARY}"
